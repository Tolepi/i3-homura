backend = "xrender";
vsync = true;
use-damage = true;

active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Firefox'",
    "class_g = 'firefox'",
    "class_g = 'Navigator'",
    "class_g = 'Polybar'"
];

opacity-rule = [
    "100:class_g = 'Firefox'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Navigator'",
    "100:class_g = 'Polybar'",

    "85:class_g = 'Kitty'",
    "85:class_g = 'kitty'",
    "85:class_g = 'Rofi'"
];

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;

shadow = false;
corner-radius = 0;

wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; opacity = 1.0; };
    dmenu = { focus = true; opacity = 1.0; };
    popup_menu = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};
