[colors]
background = #000000
foreground = #ffffff
primary = #ff2a85
secondary = #555555
alert = #ff2a85

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/top]
width = 100%
height = 22pt
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "TerminessNerdFont-Regular:size=10;2"
font-1 = "TerminessNerdFont-Bold:size=10;2"

modules-left = gentoo xworkspaces
modules-center = date
modules-right = music keyboard powermenu

cursor-click = pointer
cursor-scroll = ns-resize

[bar/bottom]
width = 100%
height = 20pt
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "TerminessNerdFont-Regular:size=9;2"

modules-left = memory cpu
modules-center = host
modules-right = volume battery

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/mpd_status.sh
interval = 1

click-left = mpc toggle
click-right = mpc next
scroll-up = mpc volume +5
scroll-down = mpc volume -5

format-background = #000000
format-foreground = #ffffff
format-padding = 1

[module/workspaces]
type = internal/xworkspaces

# Mostrar todos los workspaces o solo los del monitor actual
pin-workspaces = true

# Habilitar clics y scroll del ratón
enable-click = true
enable-scroll = true

# Formato general
icon-default = " 󰍹 "
format = <label-state>
format-background = #000000

# Workspace activo (Fucsia #ff2a85)
label-active = %name%
label-active-foreground = #000000
label-active-background = #ff2a85
label-active-padding = 1

# Workspaces ocupados / visibles pero no enfocados
label-occupied = %name%
label-occupied-foreground = #ffffff
label-occupied-background = #000000
label-occupied-padding = 1

# Workspaces urgentes (notificaciones)
label-urgent = %name%
label-urgent-foreground = #000000
label-urgent-background = #ff5555
label-urgent-padding = 1

# Workspaces vacíos
label-empty = %name%
label-empty-foreground = #444444
label-empty-background = #000000
label-empty-padding = 1

[module/powermenu]
type = custom/text
content = " 󰐥 "
content-foreground = #ff2a85
content-background = #000000

# Evento al hacer clic izquierdo
click-left = ~/.config/polybar/scripts/powermenu.sh

[module/gentoo]
type = custom/text
content = "󰣨 "
content-font = 1
content-foreground = #ff2a85
content-padding = 1
click-left = rofi -show drun

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/keyboard]
type = internal/xkeyboard
label-layout = 󰌌 %layout%
label-layout-foreground = ${colors.foreground}

[module/host]
type = custom/script
exec = echo "$(whoami)@$(hostname)  $(uname -r)"
interval = 99999
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %mb_used% / %mb_total%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/volume]
type = internal/pipewire
format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.secondary}

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT0
adapter = ADP1

format-charging = <label-charging>
label-charging = 󰂄 %percentage%%
format-discharging = <label-discharging>
label-discharging = 󰁹 %percentage%%
