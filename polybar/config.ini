[colors]
background = #000000
foreground = #ffffff
primary = #ff2a85
secondary = #555555
alert = #ff2a85

[global/wm]
margin-top = 0
margin-bottom = 0

;; =======================================================
;; BARRA SUPERIOR (TOP)
;; =======================================================
[bar/top]
width = 100%
height = 22pt
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "TerminessNerdFont-Regular:size=10;2"
font-1 = "TerminessNerdFont-Bold:size=10;2"

modules-left = gentoo i3
modules-center = date
modules-right = keyboard powermenu

cursor-click = pointer
cursor-scroll = ns-resize

;; =======================================================
;; BARRA INFERIOR (BOTTOM)
;; =======================================================
[bar/bottom]
width = 100%
height = 20pt
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "TerminessNerdFont-Regular:size=9;2"

modules-left = memory cpu
modules-center = host
modules-right = volume battery

;; =======================================================
;; MÓDULOS DE POLYBAR
;; =======================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
enable-click = true
enable-scroll = false

ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = vis;󰝚

format = <label-state> <label-mode>

label-focused = %name%
label-focused-foreground = #ffffff
label-focused-background = ${colors.primary}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = #888888
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = #ffffff
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/gentoo]
type = custom/text
content = "󰣨 "
content-font = 1
content-foreground = #ff2a85
content-padding = 1
click-left = rofi -show drun

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/keyboard]
type = internal/xkeyboard
label-layout = 󰌌 %layout%
label-layout-foreground = ${colors.foreground}

[module/host]
type = custom/script
exec = echo "$(whoami)@$(hostname)  $(uname -r)"
interval = 99999
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %mb_used% / %mb_total%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.secondary}

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT0
adapter = ADP1

format-charging = <label-charging>
label-charging = 󰂄 %percentage%%
format-discharging = <label-discharging>
label-discharging = 󰁹 %percentage%%
